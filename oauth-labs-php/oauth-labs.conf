<VirtualHost *:80>
    ServerName oauth-labs.h4ackerman.website
    DocumentRoot /var/www/oauth-labs

    <Directory /var/www/oauth-labs>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Handle .html as default index
        DirectoryIndex index.html index.php
    </Directory>

    # Allow PHP execution
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/oauth-labs-error.log
    CustomLog ${APACHE_LOG_DIR}/oauth-labs-access.log combined
</VirtualHost>
