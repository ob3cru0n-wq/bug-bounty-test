<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PM Sentinel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:520px;max-height:580px;background:#111;color:#ccc;font:11px/1.4 monospace;overflow:hidden}
.hdr{background:#0a0a0a;padding:6px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #333}
.hdr b{color:#0ff;font-size:12px;flex:1}
.hdr button{font:10px monospace;background:#1a1a1a;color:#0ff;border:1px solid #0ff;padding:2px 6px;cursor:pointer;border-radius:2px}
.hdr button:hover{background:#0ff;color:#000}
.hdr button.active{background:#0ff;color:#000}
.hdr .pause{color:#fa0;border-color:#fa0}
.hdr .pause:hover,.hdr .pause.active{background:#fa0;color:#000}
.stats{display:flex;gap:0;border-bottom:1px solid #333}
.stat{flex:1;text-align:center;padding:5px 4px;font-size:10px;border-right:1px solid #222;cursor:pointer;transition:background .15s}
.stat:last-child{border-right:0}
.stat:hover,.stat.active{background:#1a1a1a}
.stat .n{font-size:16px;font-weight:bold;display:block}
.stat .n.cyan{color:#0ff}.stat .n.green{color:#0f0}.stat .n.mag{color:#f0f}.stat .n.orange{color:#fa0}
.stat .label{color:#666;font-size:9px;text-transform:uppercase}
.content{height:460px;overflow-y:auto;padding:2px}
.entry{border-bottom:1px solid #1a1a1a;padding:4px 6px;cursor:pointer;transition:background .1s}
.entry:hover{background:#1a1a1a}
.entry .head{display:flex;align-items:center;gap:4px}
.badge{font-size:9px;padding:1px 4px;border-radius:2px;font-weight:bold;flex-shrink:0}
.badge-listener{background:#0a2a2a;color:#0ff;border:1px solid #0ff}
.badge-send{background:#2a0a2a;color:#f0f;border:1px solid #f0f}
.badge-receive{background:#0a2a0a;color:#0f0;border:1px solid #0f0}
.badge-channel{background:#2a1a0a;color:#fa0;border:1px solid #fa0}
.badge-nav{background:#1a1a2a;color:#88f;border:1px solid #88f}
.summary{color:#aaa;font-size:10px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.time{color:#555;font-size:9px;flex-shrink:0}
.detail{display:none;background:#0a0a0a;padding:4px 8px;margin:2px 0;font-size:10px;border-left:2px solid #333;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.detail.open{display:block}
.detail .key{color:#0ff}.detail .val{color:#ccc}
.empty{padding:30px;text-align:center;color:#555}
.filter-bar{padding:4px 8px;border-bottom:1px solid #222;display:flex;gap:4px;align-items:center}
.filter-bar input{font:10px monospace;background:#1a1a1a;color:#0f0;border:1px solid #333;padding:2px 4px;flex:1}
.filter-bar label{color:#555;font-size:9px}
</style>
</head>
<body>
<div class="hdr">
  <b>⚡ PM Sentinel</b>
  <button id="btn-pause" class="pause" title="Pause / Resume capture">⏸</button>
  <button id="btn-clear" title="Clear current tab data">🗑</button>
  <button id="btn-export" title="Export as JSON">📥</button>
  <button id="btn-options" title="Options">⚙</button>
</div>
<div class="stats" id="stats">
  <div class="stat active" data-tab="all"><span class="n cyan" id="n-all">0</span><span class="label">all</span></div>
  <div class="stat" data-tab="listeners"><span class="n cyan" id="n-listeners">0</span><span class="label">listeners</span></div>
  <div class="stat" data-tab="sends"><span class="n mag" id="n-sends">0</span><span class="label">sends</span></div>
  <div class="stat" data-tab="receives"><span class="n green" id="n-receives">0</span><span class="label">receives</span></div>
  <div class="stat" data-tab="channels"><span class="n orange" id="n-channels">0</span><span class="label">channels</span></div>
</div>
<div class="filter-bar">
  <label>filter:</label>
  <input id="filter" placeholder="type to filter entries…" />
</div>
<div class="content" id="content">
  <div class="empty">loading…</div>
</div>
<script src="popup.js"></script>
</body>
</html>
